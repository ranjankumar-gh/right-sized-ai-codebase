[project]
name = "rightsize"
version = "0.1.0"
description = "Companion codebase for Right-Sized AI."
readme = "README.md"
authors = [
    { name = "Ranjan Kumar", email = "mail4ranjan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
